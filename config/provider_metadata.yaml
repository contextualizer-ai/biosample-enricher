# Provider Metadata for biosample-enricher
# This file defines strengths, weaknesses, and characteristics for all data providers
# Used to auto-generate Python docstrings and documentation

# Schema version for compatibility checking
schema_version: "1.0"

providers:
  # ============================================================================
  # ELEVATION PROVIDERS
  # ============================================================================

  elevation.google:
    name: "Google Elevation API"
    class: "GoogleElevationProvider"
    module: "biosample_enricher.elevation.providers.google"

    technical:
      api_type: "REST"
      api_endpoint: "https://maps.googleapis.com/maps/api/elevation/json"
      authentication: "api_key_required"
      api_key_env_var: "GOOGLE_MAIN_API_KEY"
      rate_limit: "50 QPS (with API key)"
      timeout_default: 20
      coverage: "Global"
      resolution: "30m (varies by region)"
      data_source: "Google Earth elevation database"
      vertical_datum: "EGM96 (geoid)"

    reliability:
      stability: "high"
      data_quality: "ground_truth"
      uptime_history: "Excellent (major provider)"
      known_issues: []
      error_handling: "comprehensive"

    cost:
      pricing_model: "paid"
      free_tier: "No free tier"
      quota_limits: "Based on billing account"
      cost_per_request: "$0.005 per request (1000 locations)"

    strengths:
      - "Comprehensive global coverage"
      - "Accurate rooftop-level elevation data"
      - "Robust error handling with detailed status codes"
      - "Well-documented API"
      - "High reliability and uptime"

    weaknesses:
      - "Requires paid API key (no free tier)"
      - "Cost accumulates with high-volume use"
      - "Quota exhaustion possible (OVER_QUERY_LIMIT)"
      - "No fallback mechanisms if quota exceeded"

    use_cases:
      best_for:
        - "Production systems with API budget"
        - "High-accuracy requirements"
        - "Urban/suburban locations"
      not_suitable_for:
        - "High-volume batch processing without budget"
        - "Development/testing without API key"
      complements:
        - "Open Topo Data (free fallback)"
        - "USGS 3DEP (US-specific validation)"

    nmdc_integration:
      schema_slots:
        - "elev"
      multi_provider_role: "primary_if_key_available"
      geographic_preferences:
        excellent: ["urban", "suburban", "developed_areas"]
        good: ["global"]
        poor: []

  elevation.usgs:
    name: "USGS 3DEP Elevation"
    class: "USGSElevationProvider"
    module: "biosample_enricher.elevation.providers.usgs"

    technical:
      api_type: "ArcGIS_REST"
      api_endpoint: "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/getSamples"
      authentication: "none"
      api_key_env_var: null
      rate_limit: "Unknown (public service)"
      timeout_default: 20
      coverage: "Global (best in USA)"
      resolution: "10-30m (varies by region)"
      data_source: "3D Elevation Program"
      vertical_datum: "NAVD88"

    reliability:
      stability: "low"
      data_quality: "ground_truth"
      uptime_history: "Unreliable - multiple migrations"
      known_issues:
        - "Service has migrated multiple times (EPQS → 3DEP)"
        - "Endpoint URLs change without notice"
        - "No-data sentinel values (-1000000, -9999) complicate parsing"
        - "Intermittent availability"
      error_handling: "partial"

    cost:
      pricing_model: "free"
      free_tier: "Unlimited"
      quota_limits: "None documented"
      cost_per_request: "$0"

    strengths:
      - "Free access, no API key required"
      - "High resolution data in USA (10m)"
      - "Proper vertical datum (NAVD88)"
      - "Government-maintained dataset"

    weaknesses:
      - "⚠️ KNOWN MIGRATION ISSUES - service frequently changes"
      - "Unreliable availability"
      - "Complex no-data handling required"
      - "Endpoint may change without warning"
      - "Limited documentation on current API"

    use_cases:
      best_for:
        - "US locations when available"
        - "Development/testing (free)"
      not_suitable_for:
        - "Production systems requiring high reliability"
        - "International locations (lower priority/quality)"
        - "Time-critical applications"
      complements:
        - "Should be used WITH fallback providers"

    nmdc_integration:
      schema_slots:
        - "elev"
      multi_provider_role: "fallback_with_caution"
      geographic_preferences:
        excellent: ["usa_conus"]
        good: []
        poor: ["international", "oceans"]

  elevation.open_topo_data:
    name: "Open Topo Data"
    class: "OpenTopoDataProvider"
    module: "biosample_enricher.elevation.providers.open_topo_data"

    technical:
      api_type: "REST"
      api_endpoint: "https://api.opentopodata.org/v1/aster30m"
      authentication: "none"
      api_key_env_var: null
      rate_limit: "100 requests/minute, 1000/day"
      timeout_default: 20
      coverage: "Global"
      resolution: "250m-1km (dataset dependent)"
      data_source: "ASTER GDEM, SRTM, ETOPO1"
      vertical_datum: "EGM96"

    reliability:
      stability: "high"
      data_quality: "satellite"
      uptime_history: "Good (community-maintained)"
      known_issues: []
      error_handling: "comprehensive"

    cost:
      pricing_model: "free"
      free_tier: "1000 requests/day"
      quota_limits: "100/min, 1000/day"
      cost_per_request: "$0"

    strengths:
      - "Free access, no API key"
      - "Global coverage"
      - "Multiple dataset options (ASTER, SRTM, ETOPO1)"
      - "Stable service"
      - "Good documentation"

    weaknesses:
      - "Rate limited (100/min, 1000/day)"
      - "Coarser resolution than Google (250m-1km)"
      - "Community-maintained (not enterprise SLA)"

    use_cases:
      best_for:
        - "Development and testing"
        - "Batch processing within rate limits"
        - "Budget-constrained projects"
      not_suitable_for:
        - "Very high-volume applications (>1000/day)"
        - "Sub-100m precision requirements"
      complements:
        - "Google Elevation (for higher accuracy)"

    nmdc_integration:
      schema_slots:
        - "elev"
      multi_provider_role: "primary_free_option"
      geographic_preferences:
        excellent: ["global"]
        good: []
        poor: ["requires_sub_100m_accuracy"]

  elevation.osm:
    name: "OSM Elevation (open-elevation.com)"
    class: "OSMElevationProvider"
    module: "biosample_enricher.elevation.providers.osm"

    technical:
      api_type: "REST"
      api_endpoint: "https://api.open-elevation.com/api/v1/lookup"
      authentication: "none"
      api_key_env_var: null
      rate_limit: "Unknown (public service)"
      timeout_default: 20
      coverage: "Global"
      resolution: "90m (SRTM-based)"
      data_source: "SRTM, ASTER GDEM"
      vertical_datum: "EGM96"

    reliability:
      stability: "high"
      data_quality: "satellite"
      uptime_history: "Good"
      known_issues: []
      error_handling: "basic"

    cost:
      pricing_model: "free"
      free_tier: "Unlimited (fair use)"
      quota_limits: "None documented"
      cost_per_request: "$0"

    strengths:
      - "Free, no API key"
      - "Global coverage"
      - "90m resolution (better than Open Topo Data)"
      - "No documented rate limits"

    weaknesses:
      - "Less mature than other services"
      - "Limited documentation"
      - "Unknown reliability guarantees"

    use_cases:
      best_for:
        - "Free alternative with decent resolution"
        - "Development/testing"
      not_suitable_for:
        - "Production systems requiring SLA"
      complements:
        - "Other free elevation providers"

    nmdc_integration:
      schema_slots:
        - "elev"
      multi_provider_role: "fallback_free_option"
      geographic_preferences:
        excellent: ["global"]
        good: []
        poor: []

  # ============================================================================
  # WEATHER PROVIDERS
  # ============================================================================

  weather.meteostat:
    name: "Meteostat"
    class: "MeteostatProvider"
    module: "biosample_enricher.weather.providers.meteostat"

    technical:
      api_type: "Python_Library_CDN"
      api_endpoint: "https://bulk.meteostat.net/v2/"
      authentication: "none"
      api_key_env_var: null
      rate_limit: "None documented"
      timeout_default: 30
      coverage: "Global (120,000+ stations)"
      resolution: "Station-based (point measurements)"
      data_source: "WMO weather stations"
      temporal_coverage: "1973-present (daily), 1991-2020 (normals)"
      data_freshness: "7-day lag"

    reliability:
      stability: "high"
      data_quality: "ground_truth"
      uptime_history: "Excellent (stable library)"
      known_issues:
        - "Climate normals only available for WMO standard periods (1961-1990, 1971-2000, 1981-2010, 1991-2020)"
        - "Station coverage sparse in remote regions"
        - "Requires 10/12 months minimum for normals"
      error_handling: "comprehensive"

    cost:
      pricing_model: "free"
      free_tier: "Unlimited"
      quota_limits: "None"
      cost_per_request: "$0"

    strengths:
      - "30-year WMO standard period (1991-2020)"
      - "Station-based ground truth measurements"
      - "No API key required"
      - "Extensive station network (120,000+)"
      - "Distance tracking for quality assessment"
      - "Pre-computed normals for fast retrieval"
      - "High reliability"

    weaknesses:
      - "Sparse coverage in remote regions (deserts, mountains, oceans)"
      - "Distance uncertainty (may use station 50-100km away)"
      - "Only provides specific WMO standard periods"
      - "Station availability varies by region"
      - "Data gaps in some stations"

    use_cases:
      best_for:
        - "Urban/suburban locations with dense station coverage"
        - "When WMO-standard 30-year normals required"
        - "Scientific research requiring ground-based observations"
      not_suitable_for:
        - "Remote desert/mountain/ocean locations"
        - "Custom time periods (not WMO standard)"
      complements:
        - "NASA POWER (for remote area coverage)"

    nmdc_integration:
      schema_slots:
        - "annual_precpt"
        - "annual_temp"
        - "temp"
        - "air_temp"
      multi_provider_role: "primary_for_stations"
      geographic_preferences:
        excellent: ["urban", "suburban", "europe", "north_america", "australia"]
        good: ["populated_areas"]
        poor: ["deserts", "mountains", "oceans", "remote_regions"]

  weather.nasa_power:
    name: "NASA POWER"
    class: "NASAPowerProvider"
    module: "biosample_enricher.weather.providers.nasa_power"

    technical:
      api_type: "REST"
      api_endpoint: "https://power.larc.nasa.gov/api/temporal/climatology/point"
      authentication: "none"
      api_key_env_var: null
      rate_limit: "None documented"
      timeout_default: 30
      coverage: "Global"
      resolution: "0.5° x 0.625° (~50-60km grid)"
      data_source: "MERRA-2 satellite reanalysis"
      temporal_coverage: "2001-2020 (climatologies)"
      data_freshness: "Static climatologies"

    reliability:
      stability: "high"
      data_quality: "satellite_reanalysis"
      uptime_history: "Excellent (NASA operational service)"
      known_issues:
        - "Only provides 2001-2020 period (not WMO standard 1991-2020)"
        - "Coarser spatial resolution than station data"
      error_handling: "comprehensive"

    cost:
      pricing_model: "free"
      free_tier: "Unlimited"
      quota_limits: "None documented"
      cost_per_request: "$0"

    strengths:
      - "True global coverage (satellite-based)"
      - "No API key required"
      - "Works anywhere on Earth (deserts, mountains, oceans)"
      - "Consistent methodology globally"
      - "High stability (NASA/GMAO service)"
      - "Fast response (pre-computed)"

    weaknesses:
      - "Shorter period (20 years: 2001-2020 vs standard 30 years)"
      - "Coarser resolution (0.5° × 0.625° vs station point data)"
      - "Satellite bias in complex terrain"
      - "Not WMO standard period"
      - "Model-based (not direct measurements)"

    use_cases:
      best_for:
        - "Remote locations far from weather stations"
        - "Ocean/marine samples"
        - "Global-scale studies requiring consistent methodology"
        - "Validation/comparison against station data"
      not_suitable_for:
        - "Urban areas with local station (prefer Meteostat)"
        - "Studies requiring WMO standard 1991-2020 period"
      complements:
        - "Meteostat (for station-rich areas)"

    nmdc_integration:
      schema_slots:
        - "annual_precpt"
        - "annual_temp"
      multi_provider_role: "fallback_for_remote_areas"
      geographic_preferences:
        excellent: ["oceans", "deserts", "mountains", "antarctica", "remote_regions"]
        good: ["global"]
        poor: []

  weather.open_meteo:
    name: "Open-Meteo"
    class: "OpenMeteoProvider"
    module: "biosample_enricher.weather.providers.open_meteo"

    technical:
      api_type: "REST"
      api_endpoint: "https://archive-api.open-meteo.com/v1/era5"
      authentication: "none"
      api_key_env_var: null
      rate_limit: "10,000 requests/day"
      timeout_default: 30
      coverage: "Global"
      resolution: "11km (ERA5-Land)"
      data_source: "ERA5/ERA5-Land reanalysis"
      temporal_coverage: "1959-present (daily)"
      data_freshness: "5-day lag"

    reliability:
      stability: "high"
      data_quality: "satellite_reanalysis"
      uptime_history: "Good"
      known_issues:
        - "Does not provide pre-computed climate normals"
        - "Would require 30-360 API calls to compute normals"
      error_handling: "comprehensive"

    cost:
      pricing_model: "free"
      free_tier: "10,000 requests/day"
      quota_limits: "10,000/day"
      cost_per_request: "$0"

    strengths:
      - "ERA5 reanalysis (high quality)"
      - "11km resolution (better than NASA POWER)"
      - "No API key required"
      - "Long temporal coverage (1959-present)"
      - "Good for daily weather"

    weaknesses:
      - "Not used for climate normals (too many API calls)"
      - "Rate limited (10,000/day)"
      - "Hourly aggregation required for daily values"

    use_cases:
      best_for:
        - "Day-specific weather (collection date)"
        - "Historical daily data"
      not_suitable_for:
        - "Climate normals (use Meteostat/NASA POWER)"
      complements:
        - "Meteostat (for daily weather)"

    nmdc_integration:
      schema_slots:
        - "temp"
        - "air_temp"
        - "humidity"
        - "wind_speed"
        - "wind_direction"
      multi_provider_role: "fallback_daily_weather"
      geographic_preferences:
        excellent: ["global"]
        good: []
        poor: []

